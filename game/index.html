<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbour Lights — Spot the Difference</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="wrap">
  <header class="hud">
    <div class="title-block">
      <h1>Harbour Lights</h1>
      <p class="subtitle">Spot the Difference · <span id="level-name">Level 1 — Harbour at Dusk</span></p>
    </div>
    <div class="stats">
      <div class="stat"><span class="label">Time</span><span id="timer" class="value">2:00</span></div>
      <div class="stat"><span class="label">Found</span><span id="counter" class="value">Found 0/7 · 7 to go</span></div>
      <div class="stat"><span class="label">Score</span><span id="score" class="value">Score 0</span></div>
      <div class="stat"><span class="label">Hints</span><span id="hints" class="value">Hints 3</span></div>
    </div>
  </header>
  <div class="time-track"><div id="time-bar" class="time-bar"></div></div>

  <main class="panels">
    <figure class="panel">
      <canvas id="panel-left" width="560" height="400"></canvas>
      <figcaption>Left picture</figcaption>
    </figure>
    <figure class="panel">
      <canvas id="panel-right" width="560" height="400"></canvas>
      <figcaption>Right picture</figcaption>
    </figure>
  </main>

  <footer class="controls">
    <p id="message" class="message">Find 7 differences. Click a difference on either picture.</p>
    <div class="buttons">
      <button id="hint-btn" type="button">Hint (H)</button>
      <button id="restart-btn" type="button">Restart (R)</button>
      <button id="pause-btn" type="button">Pause (P)</button>
      <button id="sound-btn" type="button">Sound: on (M)</button>
    </div>
  </footer>
</div>

<div id="overlay" class="overlay hidden">
  <div class="overlay-card">
    <h2 id="overlay-title">Harbour Lights</h2>
    <p id="overlay-body"></p>
    <button id="overlay-btn" type="button">Start hunting</button>
    <p class="keys">Click · Arrow keys + Enter · H hint · R restart · P pause · M sound</p>
  </div>
</div>

<script type="module" src="./src/game.js"></script>
</body>
</html>
